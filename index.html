<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Puni KTV Bot</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:#111;color:#eee}h1{margin-bottom:8px}.card{background:#1d1d1d;border:1px solid #333;border-radius:14px;padding:20px;margin:18px 0}label{display:block;margin:12px 0 6px}input{box-sizing:border-box;width:100%;padding:11px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;font-size:16px}button{margin:12px 8px 0 0;padding:11px 18px;border:0;border-radius:9px;background:#9147ff;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#444}button:disabled{opacity:.45;cursor:not-allowed}.status{font-weight:700}.ok{color:#57d68d}.bad{color:#ff6b6b}pre{white-space:pre-wrap;word-break:break-word;background:#090909;padding:14px;border-radius:10px;min-height:160px;max-height:360px;overflow:auto}.small{color:#aaa;font-size:14px;line-height:1.55}
  </style>
</head>
<body>
  <h1>Puni KTV Twitch Bot</h1>
  <div class="small">這個頁面取代原本需要長期運行的外部 Bot 主機。登入 Bot Twitch 帳號後，保持此頁開啟即可監聽聊天室。</div>
  <div class="small">版本：browser-v2-20260826-proven-chat-add</div>

  <div class="card">
    <div>登入：<span id="loginStatus" class="status">尚未登入</span></div>
    <button id="loginBtn">Twitch 登入</button>
    <button id="logoutBtn" class="secondary">清除登入</button>
  </div>

  <div class="card">
    <label for="channel">要監聽的 Twitch 頻道</label>
    <input id="channel" value="puruniii" autocomplete="off">
    <button id="startBtn" disabled>開始監聽</button>
    <button id="stopBtn" class="secondary" disabled>停止</button>
    <p>狀態：<span id="botStatus" class="status">未啟動</span></p>
  </div>

  <div class="card">
    <b>執行紀錄</b>
    <pre id="log"></pre>
  </div>

  <script src="connection-watchdog.js?v=20260826-1"></script>
  <script src="bot-browser-v2.js?v=20260826-proven-chat-add"></script>
</body>
</html>
